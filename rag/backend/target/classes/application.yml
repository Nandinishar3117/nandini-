spring:
  application:
    name: docquery-ai
  datasource:
    url: jdbc:h2:mem:docquery;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change-me-in-production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

rag:
  chunk-size: ${RAG_CHUNK_SIZE:1000}
  chunk-overlap: ${RAG_CHUNK_OVERLAP:200}
  top-k: ${RAG_TOP_K:5}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.7}
  embedding-model: ${RAG_EMBEDDING_MODEL:text-embedding-3-small}
  llm-model: ${RAG_LLM_MODEL:gpt-4o-mini}

app:
  file-storage:
    directory: ${APP_FILE_STORAGE_DIR:./uploads}

logging:
  level:
    org.springframework.security: INFO
    com.docqueryai: DEBUG
