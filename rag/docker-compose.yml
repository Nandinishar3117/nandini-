version: '3.9'

services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://backend:8080/api
    depends_on:
      - backend

  backend:
    image: maven:3.9.9-eclipse-temurin-21
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
    command: sh -lc "mvn spring-boot:run"
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1000}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-200}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_SIMILARITY_THRESHOLD: ${RAG_SIMILARITY_THRESHOLD:-0.70}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-gpt-4o-mini}
      APP_FILE_STORAGE_DIR: ${APP_FILE_STORAGE_DIR:-./uploads}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/docquery
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-docquery}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-docquery}
    depends_on:
      - postgres

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docquery}
      POSTGRES_USER: ${POSTGRES_USER:-docquery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docquery}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
